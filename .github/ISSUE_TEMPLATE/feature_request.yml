name: Feature request
description: Suggest an improvement to herdr-find
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private pane titles, paths or scrollback. Use synthetic examples.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
