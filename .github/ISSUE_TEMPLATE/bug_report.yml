name: Bug report
description: Something in herdr-find does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private pane titles, paths or scrollback. Use synthetic or redacted examples.
  - type: input
    id: herdr-version
    attributes:
      label: Herdr version
      description: Output of `herdr --version`
      placeholder: herdr 0.9.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`
      placeholder: Python 3.12.3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
